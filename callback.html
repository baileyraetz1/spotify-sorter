<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spotify Auth Callback</title>
<style>
  body { background: #121212; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
  .box { background: #1e1e1e; border-radius: 12px; padding: 2rem; max-width: 600px; width: 100%; text-align: center; }
  h2 { color: #1DB954; margin-bottom: 0.5rem; }
  p { color: #b3b3b3; font-size: 0.9rem; margin-bottom: 1rem; }
  .url-box { background: #282828; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.78rem; color: #fff; word-break: break-all; text-align: left; margin-bottom: 1rem; }
  button { background: #1DB954; color: #000; font-weight: 700; border: none; border-radius: 500px; padding: 0.7rem 1.6rem; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #1ed760; }
</style>
</head>
<body>
<div class="box">
  <h2>✓ Spotify Authorized!</h2>
  <p>Copy the full URL below and paste it back into the Key Sorter app.</p>
  <div class="url-box" id="urlBox"></div>
  <button onclick="copyUrl()">Copy URL</button>
  <p style="margin-top:1rem;font-size:0.78rem;">After copying, go back to the app tab and paste it into the "Redirect URL" field.</p>
</div>
<script>
  document.getElementById('urlBox').textContent = window.location.href;
  function copyUrl() {
    navigator.clipboard.writeText(window.location.href).then(() => {
      document.querySelector('button').textContent = '✓ Copied!';
      setTimeout(() => document.querySelector('button').textContent = 'Copy URL', 2000);
    });
  }
</script>
</body>
</html>
